name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        # Temporal: macos-latest usa ARM64 y GitHub reportó falta de runners disponibles.
        # Restaurar la validación ARM64 cuando se recupere su capacidad; Intel no la sustituye.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Locale files are valid JSON with the same keys
        run: node scripts/check-locales.mjs
      - name: EVIA Spanish locale and fallback
        run: node scripts/test-evia-locale.mjs
      - name: EVIA role catalog uses versioned plan-only profiles
        run: node scripts/test-evia-roles.mjs
      - name: F1-01 task contract validation and legacy compatibility
        run: node scripts/test-task-contract.mjs
      - name: F1-02 guarded task transitions and persistence
        run: node scripts/test-task-service.mjs
      - name: F1-03 task evidence and event correlation
        run: node scripts/test-task-evidence.mjs
      - name: F1-04 crash recovery and operation idempotence
        run: node scripts/test-task-recovery.mjs
      - name: F1-05 integrated Task OS lifecycle and reconciliation
        run: node scripts/test-task-os-integration.mjs
      - name: F2-01 deterministic Director IA plan-only and crash recovery
        run: node scripts/test-director-plan.mjs
      - name: F2-02A offline Sign in with ChatGPT contract (no accounts)
        run: node scripts/test-siwc-auth-offline.mjs
      - name: F2-02A1 offline OIDC cryptographic fixtures (no accounts)
        run: node scripts/test-siwc-oidc-fixture.mjs
      - name: F2-02B1 synthetic Responses stream gate (no inference)
        run: node scripts/test-director-response-fixture.mjs
      - name: F2-02B2 GPT-6.1 Sol fixture proposal and review (no inference)
        run: node scripts/test-director-sol-fixture-flow.mjs
      - name: F2-02C/D offline Director gateway limits and explicit fallback (no inference)
        run: node scripts/test-director-offline-gateway.mjs
      - name: F2-03A local read-only synthetic Director preview (no accounts)
        run: |
          node --check web/director-preview.js
          node scripts/test-director-preview-ui.mjs
      - name: F3-01A project/client scope harness (no data access)
        run: node scripts/test-project-scope-harness.mjs
      - name: EVIA hiring UI JavaScript syntax
        run: node --check web/hire.js
      - name: Chat copy button (exact Markdown, fallback, wiring)
        run: |
          node --check web/copy.js
          node scripts/test-chat-copy.mjs
      - name: Furniture rotation (orientations, collisions, saved layout)
        run: node scripts/test-furniture-rotation.mjs
      - name: Full npm test suite (Ubuntu Node 22)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm test
      - name: Server starts, serves the UI and shuts down
        run: node scripts/smoke.mjs
        env:
          PIXEL_OFFICE_HOME: ${{ runner.temp }}/pixel-office-home

